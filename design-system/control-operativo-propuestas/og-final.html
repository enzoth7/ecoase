<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Operaciones</title>
  <style>
    @font-face { font-family: Archivo; src: url("../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; }
    body { position: relative; overflow: hidden; background: #fff; color: #26343e; font-family: Archivo, Arial, sans-serif; }
    .side { position: absolute; inset: 0 0 0 840px; background: #41515e; }
    .side img { position: absolute; width: 370px; height: 370px; top: 128px; left: -50px; opacity: .75; }
    main { position: relative; z-index: 1; padding: 72px 78px; }
    .brand { display: flex; align-items: center; gap: 18px; }
    .brand img { width: 64px; height: 64px; padding: 8px; border-radius: 12px; background: #41515e; }
    .brand strong { font-size: 26px; font-weight: 700; letter-spacing: -.025em; }
    h1 { max-width: 760px; margin: 105px 0 0; font-size: 72px; font-weight: 700; line-height: 1.03; letter-spacing: -.045em; }
    .detail { margin-top: 24px; color: #41515e; font-size: 26px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="side"><img src="../../public/operaciones-mark.svg" alt=""></div>
  <main>
    <div class="brand"><img src="../../public/operaciones-mark.svg" alt=""><strong>Operaciones</strong></div>
    <h1>Una vista clara de la operación</h1>
    <div class="detail">Pedidos, producción, stock y entregas</div>
  </main>
</body>
</html>
