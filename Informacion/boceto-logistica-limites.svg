<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
  <title id="title">Boceto de la pestaña Límites de Logística</title>
  <desc id="desc">Tabla de cuatro camiones propios con límites de pallets chicos y grandes, sección de terceros y clases de pallets.</desc>
  <style>
    .base{font-family:Inter,Arial,sans-serif;fill:#19261f}.muted{fill:#69786f}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.label{font-size:18px;font-weight:700}.h1{font-size:30px;font-weight:750;letter-spacing:-.7px}.num{font-size:24px;font-weight:760;letter-spacing:-.5px}.nav{fill:#d1ddd5;font-size:14px}.navon{fill:#fff;font-size:14px;font-weight:700}.white{fill:#fff}.green{fill:#184735}.amber{fill:#7d5a1a}
  </style>
  <rect width="1440" height="900" fill="#f4f6f2"/>
  <rect width="216" height="900" fill="#15271f"/>
  <rect x="22" y="25" width="39" height="39" rx="10" fill="#e7efe8"/><text x="41.5" y="51" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#15271f">E</text>
  <text x="75" y="51" fill="#ffffff" class="white" font-family="Arial,sans-serif" font-size="20" font-weight="750">Ecoase</text>
