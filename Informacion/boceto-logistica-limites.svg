  <text x="980" y="736" class="base body" font-weight="700">Capacidad a configurar por transportista</text><text x="980" y="761" class="base small muted">Sin límite supuesto para proveedores externos.</text>
  <rect x="980" y="787" width="170" height="42" rx="9" fill="#1d3b2f"/><text x="996" y="813" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">+ Agregar tercero</text>
