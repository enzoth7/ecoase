  <rect x="268" y="719" width="198" height="66" rx="11" fill="#e8f1e9"/><text x="284" y="745" class="base label green">Chico</text><text x="284" y="767" class="base tiny muted">≤ 120 × 100 cm</text>
  <rect x="476" y="719" width="194" height="66" rx="11" fill="#eef0ec"/><text x="492" y="745" class="base label">Grande</text><text x="492" y="767" class="base tiny muted">220 × 117 cm</text>
