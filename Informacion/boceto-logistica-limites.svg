  <text x="24" y="160" fill="#d0ddd3" class="nav base">Calendario</text><text x="24" y="205" fill="#d0ddd3" class="nav base">Pedidos</text><text x="24" y="250" fill="#d0ddd3" class="nav base">Productos</text><text x="24" y="295" fill="#d0ddd3" class="nav base">Producción</text><text x="24" y="340" fill="#d0ddd3" class="nav base">Stock</text><text x="24" y="385" fill="#d0ddd3" class="nav base">Secadero</text>
  <rect x="12" y="412" width="192" height="42" rx="10" fill="#315543"/><text x="24" y="439" fill="#d0ddd3" class="navon base">Logística</text>
  <rect x="216" y="0" width="1224" height="70" fill="#fff"/><text x="248" y="44" class="base small muted">Operaciones  /  Logística</text><text x="1350" y="44" class="base small muted">Boceto · 10 nov 2026</text>
  <text x="248" y="117" class="base h1">Límites de transporte</text><text x="248" y="142" class="base small muted">Capacidad por viaje. Cada camión conserva su límite propio y su chofer habitual.</text>
  <rect x="248" y="165" width="1158" height="55" rx="12" fill="#fff"/>
  <text x="270" y="199" class="base small muted">Asignar</text><text x="388" y="199" class="base small muted">Calendario</text><text x="528" y="199" class="base small muted">Mapa</text>
